[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biotools-annotation-quality-evaluation"
version = "0.0.0"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "jsonschema>=4.0.0",
    "pandas>=1.5.0",
    "plotly>=5.0.0",
    "pyyaml>=6.0",
    "aiohttp>=3.8.0",
    "streamlit>=1.49.0",
    "boltons",
    "numpy>=1.21.0",
    "openpyxl>=3.0.0",
    "click>=8.0.0",
    "psutil>=5.9.0",
    "owlready2",
    "rdflib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
